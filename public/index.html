<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Pacientes</title>
</head>
<body>
<header class="main-header">
    <h1>Pacientes</h1>
    <button id="btnLogout" class="btn-sair">Sair</button>
</header>

<main class="container">
    <section class="card">
        <h3>Cadastrar novo paciente</h3>
        <div class="input-group">
            <label for="nomePaciente">Nome do paciente</label>
            <div class="form-row">
                <input type="text" id="nomePaciente" placeholder="Digite o nome">
                <button onclick="cadastrarPaciente()" class="btn-primary">CADASTRAR PACIENTE</button>
            </div>
        </div>
    </section>

    <section class="card">
        <h4 id="totalPacientes">Total: 0 paciente(s).</h4>
        <hr>
        <div id="listaPacientes" class="pacientes-grid">
            <p class="empty-msg">Nenhum paciente cadastrado ainda.</p>
        </div>
    </section>
</main>

  <p id="status"></p>

  <script src="app.js"></script>
</body>
</html>
